name: Publish Go Control Plane Candidate

on:
  push:
    branches: [codex/go-control-plane]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-go-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          platforms: linux/amd64
          load: true
          tags: vps-tool/control-plane-go:smoke
          cache-from: type=gha,scope=control-plane-go

      - name: Smoke test container
        run: |
          docker run -d --rm --name vps-tool-go-smoke -p 127.0.0.1::8000 \
            -e VPS_TOOL_ADMIN_USER=ci-admin \
            -e VPS_TOOL_ADMIN_PASSWORD=ci-password-123456 \
            -e VPS_TOOL_COOKIE_SECURE=false \
            vps-tool/control-plane-go:smoke
          trap 'docker stop vps-tool-go-smoke >/dev/null 2>&1 || true' EXIT
          port=$(docker port vps-tool-go-smoke 8000/tcp | awk -F: '{print $NF}')
          for attempt in $(seq 1 30); do
            if docker exec vps-tool-go-smoke /usr/local/bin/vps-server -health; then break; fi
            if [ "$attempt" = 30 ]; then docker logs vps-tool-go-smoke; exit 1; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$port/api/health" >/dev/null
          curl --fail --silent "http://127.0.0.1:$port/" -o /tmp/vps-tool-go-index.html
          grep -qi '<!doctype html>' /tmp/vps-tool-go-index.html
          curl --fail --silent "http://127.0.0.1:$port/app.js" >/dev/null
          curl --fail --silent -H 'Content-Type: application/json' \
            --data '{"username":"ci-admin","password":"ci-password-123456"}' \
            "http://127.0.0.1:$port/api/auth/login" >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:go-candidate
            ${{ env.IMAGE_NAME }}:go-${{ github.sha }}
          cache-from: type=gha,scope=control-plane-go
          cache-to: type=gha,scope=control-plane-go,mode=max
