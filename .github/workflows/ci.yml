name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Verify Python server
        env:
          VPS_TOOL_ADMIN_USER: ci-admin
          VPS_TOOL_ADMIN_PASSWORD: ci-password-123456
          VPS_TOOL_COOKIE_SECURE: "false"
          VPS_TOOL_DB_PATH: server/data/ci.sqlite3
          PYTHONPATH: server
        run: |
          python -m compileall -q server
          python -c "from app.main import app; print(app.title)"

      - name: Verify frontend JavaScript
        run: node --check web/app.js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Verify Go Agent
        working-directory: agent
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/vps-agent ./cmd/vps-agent
