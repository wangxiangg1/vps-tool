name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Agent installer shell syntax
        run: bash -n install-agent.sh

      - name: Validate Alpine and OpenRC installer path
        run: |
          docker run --rm --volume "$PWD:/src:ro" alpine:3.22 sh -ec '
            apk add --no-cache openrc
            sh -n /src/install-agent.sh
            VPS_TOOL_INSTALLER_LIBRARY_ONLY=1 . /src/install-agent.sh
            detect_init_system
            test "$INIT_SYSTEM" = openrc
            test "$(detect_arch)" = amd64
            ensure_alpine_dependencies
            select_privilege_tool
            test "$PRIVILEGE_TOOL" = doas
            parse_arguments --node-id test-node --registration-token test-token --wss-url wss://panel.example.com/agent --xui-unit x-ui --warp-adapter generic
            test "$VPS_AGENT_NODE_ID" = test-node
            test "$VPS_AGENT_REGISTRATION_TOKEN" = test-token
            test "$VPS_AGENT_WSS_URL" = wss://panel.example.com/agent
            ensure_identity
            TMP_DIR="$(mktemp -d)"
            install_policy
            test -f /etc/doas.d/vps-agent.conf
          '

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Verify Python server
        env:
          VPS_TOOL_ADMIN_USER: ci-admin
          VPS_TOOL_ADMIN_PASSWORD: ci-password-123456
          VPS_TOOL_COOKIE_SECURE: "false"
          VPS_TOOL_DB_PATH: server/data/ci.sqlite3
          PYTHONPATH: server
        run: |
          python -m compileall -q server
          python -m unittest discover -s server/tests -p "test_*.py"
          python -c "from app.main import app; print(app.title)"

      - name: Verify frontend JavaScript
        run: node --check web/app.js

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Verify Go Agent
        working-directory: agent
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/vps-agent ./cmd/vps-agent
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/vps-agent-helper ./cmd/vps-agent-helper

      - name: Verify Go control plane
        working-directory: control-plane
        env:
          VPS_TOOL_ADMIN_USER: ci-admin
          VPS_TOOL_ADMIN_PASSWORD: ci-password-123456
          VPS_TOOL_COOKIE_SECURE: "false"
          VPS_TOOL_DB_PATH: /tmp/vps-tool-control-plane.sqlite3
          VPS_TOOL_AGENT_BINARY: /tmp/vps-agent
        run: |
          diff -rq ../web web
          gofmt -l -d cmd internal | tee /tmp/control-plane-gofmt
          test ! -s /tmp/control-plane-gofmt
          go test ./...
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid=" -o /tmp/vps-server ./cmd/vps-server
          /tmp/vps-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if /tmp/vps-server -health; then exit 0; fi
            sleep 1
          done
          exit 1

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          VPS_TOOL_ADMIN_USER: ci-admin
          VPS_TOOL_ADMIN_PASSWORD: ci-password-123456
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: vps-tool/control-plane:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Go control-plane candidate for both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: vps-tool/control-plane-go:ci
          push: false
          cache-from: type=gha,scope=control-plane-go
          cache-to: type=gha,scope=control-plane-go,mode=max
