name: Release Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Build Linux Agent binaries
        working-directory: agent
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/vps-agent-linux-amd64 ./cmd/vps-agent
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/vps-agent-linux-arm64 ./cmd/vps-agent

      - name: Generate checksums
        working-directory: dist
        run: sha256sum vps-agent-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
